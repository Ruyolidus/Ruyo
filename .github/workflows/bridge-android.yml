name: Bridge Android

on:
  push:
    branches: [multiplayer-bridge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bridge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/multiplayer-bridge'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Confirm project branch
        run: ./scripts/check-branch.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Preserve preview signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: multiplayer-bridge-debug-signing-v1
      - name: Test, lint, and build
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify distinct app identity
        run: |
          bridge_package_info=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          [[ "$bridge_package_info" == "package: name='com.ruyolidus.multiplayerbridge' "* ]]
      - name: Upload installable preview
        uses: actions/upload-artifact@v4
        with:
          name: Multiplayer-Bridge-preview-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bridge-checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/screenshots/
          if-no-files-found: ignore
          retention-days: 14

name: Android APK

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test website image discovery
        run: node scripts/test-web-discovery.mjs
      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Summarize validation results
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = sorted(Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"))
          totals = {"tests": 0, "failures": 0, "errors": 0, "skipped": 0}
          for report in reports:
              suite = ET.parse(report).getroot()
              for key in totals:
                  totals[key] += int(suite.attrib.get(key, 0))
              print(suite.attrib.get("name"), {key: suite.attrib.get(key, "0") for key in totals})
          print("TEST TOTALS:", totals, "suites:", len(reports))
          lint = Path("app/build/reports/lint-results-debug.xml")
          if lint.exists():
              issues = ET.parse(lint).getroot().findall("issue")
              print("LINT:", {level: sum(issue.attrib.get("severity") == level for issue in issues) for level in ["Fatal", "Error", "Warning"]})
          print("RENDERED PNGS:", len(list(Path("app/build/test-previews").glob("*.png"))))
          PY
      - name: Verify application ID
        run: |
          ruyo_package_info=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          echo "$ruyo_package_info"
          [[ "$ruyo_package_info" == "package: name='com.ruyo' "* ]]
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruyo-preview-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports and renderer previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ruyo-checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/test-previews/
          if-no-files-found: ignore
          retention-days: 7
      - name: Add installation instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Ruyo preview APK
          Download **Ruyo-preview** from this run's Artifacts section, extract the ZIP,
          and open **app-debug.apk** on your Android phone (Android 9 or newer).

          The application ID is **com.ruyo**, including this debug build.
          It installs separately from the first com.ruyolidus.ruyo.debug preview.

          This build adds multi-image chapters, page ordering and append, saved
          reading position, an in-app HTTPS browser, and website image imports.
          Use Add comic to select multiple files, or Browse to open a chapter link.
          Find images downloads selected pages for thumbnail/order review.
          Tap the top-right address icon to expand or collapse the browser field.
          Bubble editing supports target languages, font styles, and estimated source size.
          New imports retain up to 6 MP; recognized comment images are excluded by default.
          Repeated-preview, complete-text, and multilingual shaping checks are included.
          Joined bubble parts now have independent text areas, with manual center adjustment.
          In the editor, use Translate with AI to recognize source text and translate it.
          Add profiles in Settings > Manage AI providers. Keys are encrypted on-device.
          Live scrolling translation and generated lessons remain in development.

          Ruyo-checks includes native renderer tests and actual app-screen PNGs.

          The runner generates a debug signing key. A later build may have a different
          signing identity. If Android refuses an update, uninstall the earlier preview
          first; this removes its locally saved chapters, edits, and sentences. Persistent private signing comes later.
          SUMMARY

  device:
    name: Android 12 OCR and Keystore checks
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise real on-device services
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 2048M
          emulator-boot-timeout: 180
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Summarize device checks
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          for report in Path("app/build/outputs/androidTest-results").rglob("TEST-*.xml"):
              suite = ET.parse(report).getroot()
              print("DEVICE TESTS:", suite.attrib)
          PY
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ruyo-device-checks-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7

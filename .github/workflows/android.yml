name: Android APK

on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint, and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify application ID
        run: |
          ruyo_package_info=$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)
          echo "$ruyo_package_info"
          [[ "$ruyo_package_info" == "package: name='com.ruyo' "* ]]
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ruyo-preview-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports and renderer previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Ruyo-checks-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/test-previews/
          if-no-files-found: ignore
          retention-days: 7
      - name: Add installation instructions
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Ruyo preview APK
          Download **Ruyo-preview** from this run's Artifacts section, extract the ZIP,
          and open **app-debug.apk** on your Android phone (Android 9 or newer).

          The application ID is **com.ruyo**, including this debug build.
          It installs separately from the first com.ruyolidus.ruyo.debug preview.

          This build includes the redesigned library and reader, persistent image
          imports, manual bubble cleanup and Japanese replacement, sample lessons,
          saved sentences, and theme settings. Tap the pencil in an imported image,
          then tap the empty background inside an enclosed light bubble.
          Live AI translation, OCR, and website imports are not yet implemented.

          Ruyo-checks includes native renderer tests and actual app-screen PNGs.

          The runner generates a debug signing key. A later build may have a different
          signing identity. If Android refuses an update, uninstall the earlier preview
          first; this removes its saved sentences. Persistent private signing comes later.
          SUMMARY
